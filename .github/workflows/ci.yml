name: CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL2 and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev valgrind
      - name: Build (-Wall -Wextra -Werror)
        run: make
      - name: Tests
        run: make test
      - name: Tests under Valgrind
        run: make re DEBUG=1 && VALGRIND=1 ./tests/run_tests.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - name: Build WebAssembly (-Werror under clang)
        run: make wasm
